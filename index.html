<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        .hero {
            padding: 120px 20px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            color: #bbb;
        }

        button {
            margin-top: 25px;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #111;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>Welcome to My Website</h1>

        <p>I create modern and professional websites.</p>

        <button>Contact Me</button>
    </div>

</body>
</html>
